<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cardápio')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container">
    <h1 class="h3 mb-4">Cardápio</h1>
    <div th:if="${#maps.isEmpty(categorias)}" class="text-muted">Nenhum prato disponível no momento.</div>
    <section th:each="cat : ${categorias}" class="mb-5">
        <h2 class="h5 text-uppercase text-muted border-bottom pb-2" th:text="${cat.key}">Categoria</h2>
        <div class="row g-3">
            <div class="col-md-6 col-lg-4" th:each="prato : ${cat.value}">
                <div class="card card-prato h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <h3 class="h6 fw-bold mb-1" th:text="${prato.nome}">Prato</h3>
                            <div class="text-end text-nowrap ms-2">
                                <th:block th:with="atual=${precos[prato.id]}">
                                    <div th:if="${atual.compareTo(prato.preco) < 0}" class="preco-antigo"
                                         th:text="${'R$ ' + #numbers.formatDecimal(prato.preco, 1, 'POINT', 2, 'COMMA')}"></div>
                                    <div class="fw-bold" 
                                         th:text="${'R$ ' + #numbers.formatDecimal(atual, 1, 'POINT', 2, 'COMMA')}"></div>
                                    <span th:if="${atual.compareTo(prato.preco) < 0}" class="badge border text-dark">Promoção</span>
                                </th:block>
                            </div>
                        </div>
                        <p class="text-muted small mb-2" th:text="${prato.descricao}"></p>
                        <div class="small" th:unless="${#sets.isEmpty(prato.ingredientes)}"> <span th:each="i, st : ${prato.ingredientes}" th:text="${i.nome} + (${st.last} ? '' : ', ')"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
