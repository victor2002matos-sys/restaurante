<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Entrar')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container" style="max-width: 420px">
    <div class="card">
        <div class="card-body p-4">
            <h1 class="h4 mb-3">Área do funcionário</h1>
            <div th:if="${param.error}" class="alert alert-light border">CPF ou senha inválidos.</div>
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="cpf">CPF</label>
                    <input class="form-control" id="cpf" name="cpf" placeholder="Somente números" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="senha">Senha</label>
                    <input class="form-control" id="senha" name="senha" type="password" required>
                </div>
                <button class="btn btn-dark w-100">Entrar</button>
            </form>
            <details class="mt-3 small text-muted">
                <summary>Usuários de demonstração (senha 123456)</summary>
                <ul class="mb-0 mt-2">
                    <li>Gerente: 11111111111</li>
                    <li>Garçom: 22222222222</li>
                    <li>Cozinheiro: 33333333333</li>
                </ul>
            </details>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
