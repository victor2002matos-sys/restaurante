<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Promoções')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Promoções</h1>
        <a th:href="@{/admin/promocoes/novo}" class="btn btn-dark">Nova promoção</a>
    </div>
    <div th:replace="~{fragments/layout :: alertas}"></div>
    <table class="table table-hover bg-white align-middle">
        <thead><tr><th>Nome</th><th>Período</th><th>Desconto</th><th>Pratos</th><th>Situação</th><th></th></tr></thead>
        <tbody>
        <tr th:each="pr : ${promocoes}">
            <td class="fw-semibold" th:text="${pr.nome}"></td>
            <td th:text="${#temporals.format(pr.dataInicio, 'dd/MM/yyyy')} + ' a ' + ${#temporals.format(pr.dataFim, 'dd/MM/yyyy')}"></td>
            <td th:text="${pr.tipoDesconto.name() == 'PERCENTUAL'} ? ${#numbers.formatDecimal(pr.desconto, 1, 'POINT', 0, 'COMMA')} + '%' : 'R$ ' + ${#numbers.formatDecimal(pr.desconto, 1, 'POINT', 2, 'COMMA')}"></td>
            <td class="small"><span th:each="p, st : ${pr.pratos}" th:text="${p.nome} + (${st.last} ? '' : ', ')"></span></td>
            <td>
                <span th:if="${pr.isVigente(hoje)}" class="badge border text-dark">Vigente</span>
                <span th:if="${pr.dataInicio.isAfter(hoje)}" class="badge border text-dark">Agendada</span>
                <span th:if="${pr.dataFim.isBefore(hoje)}" class="badge border text-dark">Encerrada</span>
            </td>
            <td class="text-end text-nowrap">
                <a th:href="@{/admin/promocoes/{id}/editar(id=${pr.id})}" class="btn btn-sm btn-outline-secondary"> </a>
                <form th:action="@{/admin/promocoes/{id}/excluir(id=${pr.id})}" method="post" class="d-inline" onsubmit="return confirm('Excluir esta promoção?')">
                    <button class="btn btn-sm btn-outline-secondary"> </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
