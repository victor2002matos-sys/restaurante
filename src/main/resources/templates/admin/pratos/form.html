<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Prato')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container" style="max-width: 820px">
    <h1 class="h3 mb-3" th:text="${prato.id == null} ? 'Novo prato' : 'Editar prato'"></h1>
    <form th:action="@{/admin/pratos}" th:object="${prato}" method="post" class="card card-body">
        <input type="hidden" th:field="*{id}">
        <div class="row g-3">
            <div class="col-md-8">
                <label class="form-label">Nome *</label>
                <input class="form-control" th:field="*{nome}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{nome}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label">Preço (R$) *</label>
                <input class="form-control" th:field="*{preco}" th:errorclass="is-invalid" placeholder="0.00" inputmode="decimal">
                <div class="invalid-feedback">Informe um preço válido maior que zero, usando ponto como separador (ex.: 32.90).</div>
            </div>
            <div class="col-md-6">
                <label class="form-label">Categoria *</label>
                <input class="form-control" th:field="*{categoria}" list="categorias" th:errorclass="is-invalid">
                <datalist id="categorias"><option th:each="c : ${categorias}" th:value="${c}"></option></datalist>
                <div class="invalid-feedback" th:errors="*{categoria}"></div>
            </div>
            <div class="col-md-6 d-flex align-items-end">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" th:field="*{disponivel}">
                    <label class="form-check-label" th:for="${#ids.prev('disponivel')}">Disponível no cardápio</label>
                </div>
            </div>
            <div class="col-12">
                <label class="form-label">Descrição</label>
                <textarea class="form-control" th:field="*{descricao}" rows="2"></textarea>
            </div>
            <div class="col-12">
                <label class="form-label">Ingredientes</label>
                <div class="border rounded p-2 bg-white" style="max-height: 220px; overflow-y: auto">
                    <div class="row">
                        <div class="col-6 col-md-4" th:each="ing : ${ingredientes}">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" th:field="*{ingredientes}" th:value="${ing.id}">
                                <label class="form-check-label" th:for="${#ids.prev('ingredientes')}" th:text="${ing.nome}"></label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-text">Ingrediente que não está na lista? <a th:href="@{/admin/ingredientes}">Cadastre aqui</a>.</div>
            </div>
        </div>
        <div class="mt-4 d-flex gap-2">
            <button class="btn btn-marca">Salvar</button>
            <a th:href="@{/admin/pratos}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
