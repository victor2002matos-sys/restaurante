<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | OHMELETE'">Restaurante</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-light bg-white border-bottom mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">OHMELETE</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/cardapio}">Cardápio</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/avaliacao}">Avaliar</a></li>
                <li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link" th:href="@{/painel}">Painel</a></li>
                <li class="nav-item" sec:authorize="hasAnyRole('GARCOM','GERENTE')"><a class="nav-link" th:href="@{/pedidos}">Pedidos</a></li>
                <li class="nav-item" sec:authorize="hasAnyRole('GARCOM','GERENTE')"><a class="nav-link" th:href="@{/clientes}">Clientes</a></li>
                <li class="nav-item" sec:authorize="hasAnyRole('COZINHEIRO','GERENTE')"><a class="nav-link" th:href="@{/cozinha}">Cozinha</a></li>
                <li class="nav-item dropdown" sec:authorize="hasRole('GERENTE')">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Administração</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/admin/pratos}">Pratos</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/ingredientes}">Ingredientes</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/promocoes}">Promoções</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/mesas}">Mesas</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/funcionarios}">Funcionários</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/avaliacoes}">Avaliações</a></li>
                    </ul>
                </li>
            </ul>
            <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
                <span class="navbar-text small">CPF <span sec:authentication="name"></span>
                </span>
                <form th:action="@{/logout}" method="post">
                    <button class="btn btn-sm btn-outline-secondary">Sair</button>
                </form>
            </div>
            <a sec:authorize="!isAuthenticated()" class="btn btn-sm btn-outline-secondary" th:href="@{/login}">Área do funcionário</a>
        </div>
    </div>
</nav>

<div th:fragment="alertas">
    <div th:if="${sucesso}" class="alert alert-light border alert-dismissible fade show"> <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${erro}" class="alert alert-light border alert-dismissible fade show"> <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<span th:fragment="status(s)" th:class="'badge-status status-' + ${s.name()}" th:text="${s.descricao}"></span>

<th:block th:fragment="scripts">
    <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</th:block>
</body>
</html>
