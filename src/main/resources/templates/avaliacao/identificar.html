<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Avaliar atendimento')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container" style="max-width: 520px">
    <div class="card"><div class="card-body p-4">
        <h1 class="h4">Avalie seu atendimento</h1>
        <p class="text-muted">Informe o número do pedido que aparece na sua nota.</p>
        <div th:replace="~{fragments/layout :: alertas}"></div>
        <form th:action="@{/avaliacao/validar}" method="post">
            <div class="mb-3">
                <label class="form-label" for="pedidoId">Número do pedido</label>
                <input class="form-control" type="number" min="1" id="pedidoId" name="pedidoId" th:value="${pedidoId}" required>
            </div>
            <button class="btn btn-dark w-100">Continuar</button>
        </form>
    </div></div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
