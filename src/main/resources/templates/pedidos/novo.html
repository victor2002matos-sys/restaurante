<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Novo pedido')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container">
    <h1 class="h3 mb-3">Novo pedido</h1>
    <div th:replace="~{fragments/layout :: alertas}"></div>
    <form th:action="@{/pedidos}" th:object="${form}" method="post">
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card card-body mb-3">
                    <div class="row g-3">
                        <div class="col-md-5">
                            <label class="form-label">Mesa *</label>
                            <select class="form-select" th:field="*{mesaNumero}" required>
                                <option value="">Selecione...</option>
                                <option th:each="m : ${mesas}" th:value="${m.numero}"
                                        th:disabled="${ocupadas.contains(m.numero)}"
                                        th:text="'Mesa ' + ${m.numero} + (${ocupadas.contains(m.numero)} ? ' (ocupada)' : '')"></option>
                            </select>
                        </div>
                        <div class="col-md-7">
                            <label class="form-label">Cliente (CPF, opcional)</label>
                            <input class="form-control" th:field="*{clienteCpf}" list="lista-clientes" placeholder="Deixe em branco se não quiser identificar">
                            <datalist id="lista-clientes">
                                <option th:each="c : ${clientes}" th:value="${c.cpf}" th:text="${c.nome}"></option>
                            </datalist>
                            <input class="form-control mt-2" th:field="*{clienteNome}" placeholder="Nome (opcional, para CPF ainda não cadastrado)">
                            <div class="form-text">Não precisa cadastrar antes: um CPF novo é cadastrado junto com o pedido.</div>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header fw-semibold">Pratos</div>
                    <table class="table mb-0 align-middle">
                        <thead><tr><th>Prato</th><th>Categoria</th><th class="text-end">Preço</th><th style="width: 110px">Qtd.</th></tr></thead>
                        <tbody>
                        <tr th:each="prato : ${pratos}">
                            <td>
                                <span th:text="${prato.nome}"></span>
                                <span th:if="${precos[prato.id].compareTo(prato.preco) < 0}" class="badge border text-dark ms-1">Promoção</span>
                            </td>
                            <td class="small text-muted" th:text="${prato.categoria}"></td>
                            <td class="text-end" th:text="${'R$ ' + #numbers.formatDecimal(precos[prato.id], 1, 'POINT', 2, 'COMMA')}"></td>
                            <td>
                                <input type="number" min="0" max="99" class="form-control form-control-sm qtd"
                                       th:name="'quantidades[' + ${prato.id} + ']'"
                                       th:value="${form.quantidades[prato.id]}"
                                       th:attr="data-preco=${precos[prato.id]},data-nome=${prato.nome}">
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card card-body position-sticky" style="top: 1rem">
                    <h2 class="h5">Resumo</h2>
                    <ul id="resumo" class="list-unstyled small mb-2"><li class="text-muted">Nenhum prato adicionado.</li></ul>
                    <div class="d-flex justify-content-between fw-bold fs-5 border-top pt-2">
                        <span>Total</span><span id="total">R$ 0,00</span>
                    </div>
                    <button class="btn btn-dark mt-3">Confirmar pedido</button>
                    <a th:href="@{/pedidos}" class="btn btn-outline-secondary mt-2">Cancelar</a>
                </div>
            </div>
        </div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
    // UC-1, passo 6: calcula os valores e mostra o resumo enquanto o garçom escolhe os pratos
    const brl = v => 'R$ ' + v.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    function atualizar() {
        const resumo = document.getElementById('resumo');
        let total = 0, linhas = [];
        document.querySelectorAll('.qtd').forEach(input => {
            const q = parseInt(input.value || '0', 10);
            if (q > 0) {
                const sub = q * parseFloat(input.dataset.preco);
                total += sub;
                linhas.push(`<li class="d-flex justify-content-between"><span>${q}x ${input.dataset.nome}</span><span>${brl(sub)}</span></li>`);
            }
        });
        resumo.innerHTML = linhas.length ? linhas.join('') : '<li class="text-muted">Nenhum prato adicionado.</li>';
        document.getElementById('total').textContent = brl(total);
    }
    document.querySelectorAll('.qtd').forEach(i => i.addEventListener('input', atualizar));
    atualizar();
</script>
</body>
</html>
