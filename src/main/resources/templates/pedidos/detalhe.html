<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pedido')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container" style="max-width: 860px">
    <a th:href="@{/pedidos}" class="small">&larr; Voltar aos pedidos</a>
    <div class="d-flex justify-content-between align-items-center my-3">
        <h1 class="h3 mb-0">Pedido #<span th:text="${pedido.id}"></span></h1>
        <span th:replace="~{fragments/layout :: status(${pedido.status})}"></span>
    </div>
    <div th:replace="~{fragments/layout :: alertas}"></div>
    <div class="card card-body mb-3">
        <div class="row">
            <div class="col-md-3"><div class="text-muted small">Mesa</div><div class="fw-semibold" th:text="${pedido.mesa.numero}"></div></div>
            <div class="col-md-3"><div class="text-muted small">Cliente</div><div class="fw-semibold" th:text="${pedido.cliente?.nome ?: '—'}"></div></div>
            <div class="col-md-3"><div class="text-muted small">Funcionário</div><div class="fw-semibold" th:text="${pedido.funcionario.nome}"></div></div>
            <div class="col-md-3"><div class="text-muted small">Data e hora</div><div class="fw-semibold" th:text="${#temporals.format(pedido.dataHora, 'dd/MM/yyyy HH:mm')}"></div></div>
        </div>
        <div th:if="${pedido.cliente?.alergias}" class="alert alert-light border mt-3 mb-0 py-2">Alergias do cliente: <strong th:text="${pedido.cliente.alergias}"></strong>
        </div>
    </div>
    <table class="table bg-white">
        <thead><tr><th>Prato</th><th class="text-end">Qtd.</th><th class="text-end">Preço unit.</th><th class="text-end">Subtotal</th></tr></thead>
        <tbody>
        <tr th:each="item : ${pedido.itens}">
            <td th:text="${item.prato.nome}"></td>
            <td class="text-end" th:text="${item.quantidade}"></td>
            <td class="text-end" th:text="${'R$ ' + #numbers.formatDecimal(item.precoUnitario, 1, 'POINT', 2, 'COMMA')}"></td>
            <td class="text-end" th:text="${'R$ ' + #numbers.formatDecimal(item.subtotal, 1, 'POINT', 2, 'COMMA')}"></td>
        </tr>
        </tbody>
        <tfoot><tr class="fw-bold"><td colspan="3" class="text-end">Total</td>
            <td class="text-end" th:text="${'R$ ' + #numbers.formatDecimal(pedido.total, 1, 'POINT', 2, 'COMMA')}"></td></tr></tfoot>
    </table>
    <div class="d-flex gap-2">
        <form th:if="${pedido.status.proximo() != null}" th:action="@{/pedidos/{id}/avancar(id=${pedido.id})}" method="post">
            <button class="btn btn-dark" th:text="'Marcar como ' + ${pedido.status.proximo().descricao.toLowerCase()}"></button>
        </form>
        <form th:if="${pedido.status.aberto}" th:action="@{/pedidos/{id}/cancelar(id=${pedido.id})}" method="post"
              onsubmit="return confirm('Cancelar este pedido?')">
            <button class="btn btn-outline-secondary">Cancelar pedido</button>
        </form>
    </div>
    <div th:if="${pedido.avaliacao}" class="card card-body mt-4">
        <div class="text-muted small">Avaliação do cliente</div>
        <div class="fs-4 fw-bold"><span th:text="${pedido.avaliacao.nota}"></span>/10</div>
        <div th:text="${pedido.avaliacao.comentario}"></div>
    </div>
    <div th:if="${pedido.status.name() == 'FINALIZADO' and pedido.avaliacao == null}" class="alert alert-light border mt-4">
        O cliente pode avaliar este pedido em <a th:href="@{/avaliacao(pedido=${pedido.id})}">/avaliacao</a> informando o número
        <strong th:text="${pedido.id}"></strong>.
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
