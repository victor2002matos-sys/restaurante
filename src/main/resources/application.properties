spring.application.name=restaurante

# Banco H2 em memória: roda sem instalar nada. Os dados de exemplo são recriados a cada inicialização.
# Para usar PostgreSQL, rode com o perfil "postgres" (veja application-postgres.properties e o README).
spring.datasource.url=jdbc:h2:mem:restaurante;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

spring.thymeleaf.cache=false
server.servlet.session.timeout=60m
