spring.application.name=restaurante

# Banco de dados: PostgreSQL (SGBD). Antes da primeira execução, crie o banco
# com o criar-banco.bat (Windows) ou o banco/criar-banco.sql; veja o README.
# Os valores abaixo podem ser trocados pelas variáveis de ambiente DB_URL, DB_USUARIO e DB_SENHA.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/restaurante}
spring.datasource.username=${DB_USUARIO:restaurante}
spring.datasource.password=${DB_SENHA:restaurante}

# O Hibernate cria as tabelas na primeira execução e as mantém nas próximas,
# sem apagar os dados. Os dados de exemplo só são inseridos com o banco vazio.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

spring.thymeleaf.cache=false
server.servlet.session.timeout=60m
