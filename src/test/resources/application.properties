spring.application.name=restaurante

# Somente para os testes automáticos (./mvnw test): banco H2 temporário, para os
# testes rodarem sem PostgreSQL instalado. O sistema em si usa PostgreSQL.
spring.datasource.url=jdbc:h2:mem:restaurante;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.thymeleaf.cache=false
